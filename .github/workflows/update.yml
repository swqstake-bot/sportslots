# Build + electron-builder --publish → GitHub Release + latest.yml (electron-updater).
# Feed: swqstake-bot/sportslots-releases (öffentlich). Dual-Publish auch auf sportslots (Migration).
# Docs: docs/auto-update-feed.md
# Start: GitHub → Actions → „Update“ → „Run workflow“ (Branch auswählen, z. B. main).
# Kontinuierliche Checks ohne Publish: Workflow „CI“ (bei Push auf main / restore/**).

name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show version from package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Publishing swqbot v$v → sportslots-releases (+ sportslots dual-publish)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Quality Gate (Lint + QA Harness)
        run: |
          npm run lint
          npm run qa:gate

      # RELEASES_GITHUB_TOKEN: PAT (repo) mit Schreibzugriff auf sportslots-releases und sportslots.
      # Default GITHUB_TOKEN reicht nicht für Cross-Repo-Publish.
      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run build:publish
