# Tag v1.2.3 pushen ÔåÆ Release-Build. Oder manuell: Actions ÔåÆ ÔÇ×ReleaseÔÇ£ ÔåÆ Run workflow.
# Feed: swqstake-bot/sportslots-releases. Dual-Publish auf sportslots w├ñhrend Migration.
# Docs: docs/auto-update-feed.md
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Leer lassen = Version aus package.json (empfohlen f├╝r Auto-Update)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require RELEASES_GITHUB_TOKEN
        shell: pwsh
        env:
          RELEASES_GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_GITHUB_TOKEN)) {
            Write-Error 'RELEASES_GITHUB_TOKEN is not set. Dual-publish needs a PAT (repo scope). See docs/auto-update-feed.md'
            exit 1
          }
          Write-Host 'RELEASES_GITHUB_TOKEN is configured'

      - name: Set version from tag, input, or package.json
        shell: pwsh
        run: |
          $evt = '${{ github.event_name }}'
          if ($evt -eq 'workflow_dispatch') {
            $input = '${{ github.event.inputs.version }}'.Trim()
            if ($input -ne '') {
              npm pkg set version=$input
              Write-Host "Building version $input (manual)"
            } else {
              $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
              Write-Host "Building version $v (from package.json)"
            }
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
            npm pkg set version=$version
            Write-Host "Building version $version (from tag)"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Quality Gate (Lint + QA Harness)
        run: |
          npm run lint
          npm run qa:gate

      # electron-builder downloads NSIS/winCodeSign from GitHub Releases; 502s are transient.
      # RELEASES_GITHUB_TOKEN: PAT (repo) f├╝r sportslots-releases + sportslots (Dual-Publish).
      - name: Build and Publish
        uses: nick-fields/retry@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          command: npm run build:publish
